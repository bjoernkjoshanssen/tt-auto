status:
  scope: >-
    The compared declarations are exactly
    OAI.TuringRigidity.TwoConeMain.cones_orderIso_iff and
    OAI.TuringRigidity.TwoConeMain.cone_iso_apply_val, for ordinary Turing
    degrees of Boolean characteristic functions using Mathlib Turing
    reducibility. The first states pairwise non-isomorphism for unequal
    bases; the second states pointwise identity of every cone isomorphism,
    including rigidity when the bases coincide. These are principal UPPER
    cones, with unrestricted set degrees, not lower cones, arbitrary filters,
    or only computably enumerable degrees. No Borel, continuity, determinacy,
    persistence, or model-existence premise remains. The proof is in classical
    Lean foundations; a separate ZFC or ZF derivation has not been extracted.
    The placeholder counts below concern the selected proved results and
    their dependencies, excluding the two deliberate Challenge proof holes
    and unrelated historical work in this repository.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "OAI.TuringRigidity.TwoConeMain.cones_orderIso_iff"
      file: "RequestProject/TuringTwoConeMain.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "OAI.TuringRigidity.TwoConeMain.cone_iso_apply_val"
