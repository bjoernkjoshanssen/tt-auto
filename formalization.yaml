version: "v0.4"

project:
  name: "Pairwise rigidity of principal upper cones of Turing degrees"
  description: >-
    Two principal upper cones in the ordinary Turing degrees are
    order-isomorphic if and only if their base degrees are equal. Moreover,
    every isomorphism between such cones fixes every underlying degree, so
    every individual cone has only the identity automorphism. Both compared
    statements concern arbitrary order isomorphisms, without regularity,
    determinacy, persistence, or model-existence hypotheses. The proof extends
    the earlier whole-structure-versus-cone argument to two independent bases.
  authors: ["Bjørn Kjos-Hanssen"]
  responsible_maintainers: ["Bjørn Kjos-Hanssen"]
  license: "Apache-2.0"

