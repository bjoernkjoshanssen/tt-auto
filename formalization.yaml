fidelity:
  divergences: >-
    This result generalizes the earlier whole-structure-versus-cone theorem
    to two arbitrary principal upper cones and additionally proves pointwise
    identity of every such isomorphism. The proof keeps the two bases distinct,
    using e(a') and e-inverse(b') as separate locality parameters and relative
    minimal pairs over the target base joined with the input. The Challenge
    independently defines the ordinary quotient and order using only Mathlib;
    concrete join and bottom instances match the Solution definitions. Exact
    proof-theoretic strength in ZFC or ZF is not claimed.

review:
  status: "self-assessed; independent review pending"
  notes: >-
    The human-directed development used ChatGPT-assisted self-checks and
    machine verification; no distinct independent agent or human review is
    claimed. The completed two-cone proof passed its Lean build, seven audit
    scripts, exact unconditional type checks, and a 172-declaration axiom
    audit at 38a3424923d2a35a15abbdf742ac78e2d04084fd before merge. That run's
    separate Comparator concerned only the earlier registered theorem. This
    new package requires fresh Comparator verification of BOTH newly selected
    declarations at the submitted immutable commit. No source-author
    endorsement or Palomar registration of the new result is asserted by
    preparing these files.

