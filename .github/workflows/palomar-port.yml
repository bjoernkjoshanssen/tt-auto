name: Palomar branch preparation

# Temporary, branch-restricted migration workflow. Removed before this PR is
# ready to merge. Only the prepare job can write, and only this fixed branch
# is a push destination. Verification uses a read-only token.
on:
  push:
    branches: [palomar-submission]

permissions:
  contents: read

concurrency:
  group: palomar-port
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'bjoernkjoshanssen/tt-auto' && github.ref == 'refs/heads/palomar-submission'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Port source headers
        run: python3 scripts/port-palomar-modules.py
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Refresh pinned dependency manifest
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
        run: lake update
      - name: Commit preparation to the dedicated branch
        id: commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = bjoernkjoshanssen/tt-auto
          test "$GITHUB_REF" = refs/heads/palomar-submission
          actual=$(git ls-remote origin refs/heads/palomar-submission | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git add -u
          git add LICENSE
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Port Lean sources to modules and refresh Palomar dependency pins'
            git push origin HEAD:refs/heads/palomar-submission
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Prepared commit: $(git rev-parse HEAD)"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: 'false'
          build: 'true'
          build-args: 'Challenge Solution'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Preserve dependencies after failure
        if: failure()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: palomar-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ needs.prepare.outputs.commit }}
