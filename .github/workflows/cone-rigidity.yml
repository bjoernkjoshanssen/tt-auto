name: Cone rigidity and Palomar verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cone-rigidity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install metadata and sandbox prerequisites
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq python3-yaml python3-jsonschema bubblewrap zstd >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check full source snapshot and submission metadata
        run: |
          /usr/bin/python3 scripts/check-palomar.py
          /usr/bin/python3 scripts/check-formalization.py
      - name: Install checksum-verified pinned Lean toolchain
        run: bash scripts/install-ci-lean.sh
      - name: Restore dependencies from earlier checks
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: palomar-verified-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            palomar-verified-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            two-cone-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Build independent Challenge and Solution
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          # Build the former endpoint explicitly for its retained regression audits.
          lake build Challenge Solution RequestProject.TuringConeMain 2>&1 | tee palomar-build.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Verify toolchain agreement and transitive axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/check-palomar.py
          lake env lean scripts/CheckConeRigidity.lean | tee cone-rigidity-axioms.txt
          lake env lean scripts/CheckConeOracleProgram.lean | tee cone-program-axioms.txt
          lake env lean scripts/CheckConeMain.lean | tee cone-main-axioms.txt
          lake env lean scripts/CheckPalomar.lean | tee cone-palomar-axioms.txt
          python3 scripts/check-axioms.py cone-*-axioms.txt
      - name: Compare independent Challenge with Solution using bundled kernels
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-comparator.sh 2>&1 | tee palomar-comparator.log
      - name: Preserve dependencies after verification
        if: always() && hashFiles('.lake/packages/mathlib/lean-toolchain') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: palomar-verified-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-${{ github.run_attempt }}
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: palomar-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            cone-*-axioms.txt
            palomar-*.log
          if-no-files-found: ignore
