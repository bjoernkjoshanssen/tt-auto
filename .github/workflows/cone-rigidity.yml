name: Cone rigidity Lean check

on:
  pull_request:
    paths:
      - 'RequestProject/TuringCone*.lean'
      - 'OAI/**'
      - 'scripts/CheckConeRigidity.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/cone-rigidity.yml'

permissions:
  contents: read

concurrency:
  group: cone-rigidity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: 'false'
          build: 'true'
          build-args: 'RequestProject.TuringConeRepresentation'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Preserve dependencies after a failed build
        if: failure()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Report theorem axioms and reject sorryAx
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/CheckConeRigidity.lean | tee cone-rigidity-axioms.txt
          if grep -q 'sorryAx' cone-rigidity-axioms.txt; then
            echo 'A cone theorem depends on sorryAx.' >&2
            exit 1
          fi
