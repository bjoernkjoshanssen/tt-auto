name: Palomar module migration (temporary)

on:
  push:
    branches: [palomar-registry]
    paths:
      - '.github/workflows/palomar-bootstrap.yml'
      - 'scripts/port-palomar-modules.py'

permissions:
  contents: write

jobs:
  port:
    if: github.repository == 'bjoernkjoshanssen/tt-auto' && github.ref == 'refs/heads/palomar-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: palomar-registry
      - name: Port headers and pin the new dependency closure
        run: python3 scripts/port-palomar-modules.py
      - name: Commit only to the preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.lean' lake-manifest.json LICENSE
          if ! git diff --cached --quiet; then
            git commit -m 'Port source headers to Lean modules and pin Palomar toolchain dependencies'
            git push origin HEAD:palomar-registry
          fi
      - name: Record the source snapshot
        run: git archive --format=zip HEAD > /tmp/palomar-source.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: palomar-source
          path: /tmp/palomar-source.zip
          if-no-files-found: error
