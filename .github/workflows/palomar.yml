name: Palomar readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palomar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install metadata parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Preflight metadata, independent statement and all Lean sources
        run: python3 scripts/check-palomar.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: 'false'
          build: 'true'
          build-args: 'Challenge Solution'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Preserve dependencies after a failed build
        if: failure()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Audit the selected proof and earlier endpoints
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/CheckConeRigidity.lean | tee cone-rigidity-axioms.txt
          lake env lean scripts/CheckConeOracleProgram.lean | tee cone-program-axioms.txt
          lake env lean scripts/CheckConeMain.lean | tee cone-main-axioms.txt
          if grep -E 'sorryAx|Lean.ofReduceBool' cone-*-axioms.txt; then exit 1; fi
      - name: Install Comparator sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare the independent statement and check the exported proof
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-comparator.sh 2>&1 | tee palomar-comparator.log
      - name: Recheck the resolved Mathlib toolchain
        run: python3 scripts/check-palomar.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: palomar-verification
          path: |
            cone-*-axioms.txt
            palomar-comparator.log
          if-no-files-found: ignore
